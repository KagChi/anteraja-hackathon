<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="theme-color" content="#f9f9ff">
        <title>Anteraja Frozen — Tidak ada koneksi</title>
        <style>
            /* Self-contained on purpose: this page has to render with nothing
               but the cache, so it carries its own tiny style sheet. */
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #f9f9ff;
                color: #111c2d;
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-align: center;
            }

            .card {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                max-width: 360px;
            }

            .badge {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 64px;
                height: 64px;
                border-radius: 20px;
                background: #b6005b;
                color: #ffffff;
                font-size: 28px;
            }

            h1 {
                margin: 0;
                font-size: 20px;
                line-height: 28px;
            }

            p {
                margin: 0;
                font-size: 13px;
                line-height: 19px;
                color: #5a3f46;
            }

            button {
                margin-top: 8px;
                height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 12px;
                background: #b6005b;
                color: #ffffff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="badge">❄</div>
            <h1>Tidak ada koneksi</h1>
            <p>
                Aplikasi ini butuh internet untuk memuat pesanan dan tugas terbaru. Periksa koneksi Anda, lalu coba
                lagi.
            </p>
            <button type="button" onclick="location.reload()">Coba Lagi</button>
        </div>
    </body>
</html>
