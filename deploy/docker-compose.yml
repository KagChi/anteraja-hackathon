version: '3.8'

# =============================================================================
# Anteraja Frozen - Backend Production Stack (FrankenPHP / Octane)
# =============================================================================
# Arsitektur Jaringan (Zero Trust):
#   - backend-net  : Terhubung ke Nginx Centralized Reverse Proxy
#                    Nginx upstream: server anteraja-frozen-backend:80;
#   - anteraja-net : Jaringan privat internal terisolasi (App <-> PostgreSQL, Redis)
#                    Database & Redis TIDAK terhubung ke backend-net maupun internet.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. LARAVEL OCTANE (FrankenPHP) - Backend Service
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: anteraja-frozen-backend
    restart: unless-stopped
    # Port 80 hanya diekspose ke internal docker network (Zero Trust)
    expose:
      - "80"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://frozen.madgo.my.id}
      - ASSET_URL=${ASSET_URL:-https://frozen.madgo.my.id}
      - OCTANE_SERVER=frankenphp
      - OCTANE_PORT=80
      - OCTANE_WORKERS=${OCTANE_WORKERS:-4}
      - OCTANE_MAX_REQUESTS=${OCTANE_MAX_REQUESTS:-500}
      - DB_CONNECTION=pgsql
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-anteraja_frozen}
      - DB_USERNAME=${DB_USERNAME:-anteraja}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - RUN_SEEDS=${RUN_SEEDS:-true}
    volumes:
      - anteraja-storage:/app/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net   # Menerima request dari Nginx Reverse Proxy
      - anteraja-net  # Mengakses database PostgreSQL dan Redis

  # ---------------------------------------------------------------------------
  # 2. POSTGRESQL 18 - Primary Database
  # ---------------------------------------------------------------------------
  pgsql:
    image: postgres:18-alpine
    container_name: anteraja-frozen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-anteraja_frozen}"
      POSTGRES_USER: "${DB_USERNAME:-anteraja}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - pgsql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - anteraja-net # HANYA terhubung ke app, terisolasi dari proxy & internet

  # ---------------------------------------------------------------------------
  # 3. REDIS 8 - Cache, Session, & Queue Driver
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: anteraja-frozen-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
      timeout: 5s
    networks:
      - anteraja-net # HANYA terhubung ke app

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  # Network eksternal dari Nginx Reverse Proxy VPS
  backend-net:
    external: true

  # Network privat terisolasi untuk Postgres & Redis
  anteraja-net:
    driver: bridge
    internal: false

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  pgsql-data:
    name: anteraja_frozen_pgsql_data
  redis-data:
    name: anteraja_frozen_redis_data
  anteraja-storage:
    name: anteraja_frozen_storage_data
