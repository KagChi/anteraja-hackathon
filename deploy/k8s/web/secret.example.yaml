# Template saja — jangan commit nilai asli.
#
# Secret sebenarnya dibuat langsung di cluster (lihat README langkah 2) dengan
# menyalin kunci dari Secret "anteraja-secrets" lalu menimpa nilai di bawah.
apiVersion: v1
kind: Secret
metadata:
  name: anteraja-hackathon-secrets
  namespace: prod-other
  labels:
    app.kubernetes.io/name: anteraja-hackathon
type: Opaque
stringData:
  APP_KEY: "base64:CHANGE_ME_WITH_php_artisan_key_generate_--show"
  DB_PASSWORD: "CHANGE_ME"
  # Harus sama dengan ANTERAJA_WEBHOOK_TOKEN pada Secret n8n-secrets.
  N8N_WEBHOOK_TOKEN: "CHANGE_ME"
