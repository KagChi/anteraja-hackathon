apiVersion: v1
kind: ConfigMap
metadata:
  name: anteraja-hackathon-config
  namespace: prod-other
  labels:
    app.kubernetes.io/name: anteraja-hackathon
data:
  APP_NAME: "Anteraja Hackathon"
  APP_ENV: "production"
  APP_DEBUG: "false"
  # Aplikasi menyimpan waktu dalam UTC dan mengubahnya ke WIB hanya saat
  # menampilkan (App\Support\DisplayTime). Jangan disetel ke zona lain: nilai
  # ini juga menentukan zona sesi database (lihat config/database.php).
  APP_TIMEZONE: "UTC"
  APP_URL: "https://hackathon.kagchi.my.id"
  # Notifikasi WhatsApp dikirim lewat workflow n8n (lihat deploy/n8n/README.md).
  N8N_WEBHOOK_ENABLED: "true"
  N8N_WEBHOOK_URL: "http://n8n/webhook/anteraja-frozen/notify"
  APP_LOCALE: "id"
  APP_FALLBACK_LOCALE: "en"

  LOG_CHANNEL: "stack"
  LOG_STACK: "single"
  LOG_LEVEL: "warning"

  # CloudNativePG write service pada cluster "postgres".
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres-rw"
  DB_PORT: "5432"
  DB_DATABASE: "anteraja_hackathon"
  DB_USERNAME: "anteraja"
  DB_SEARCH_PATH: "public"
  DB_SSLMODE: "prefer"

  # Dragonfly sebagai Redis-compatible store; DB index terpisah dari app lain.
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "dragonfly"
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  REDIS_CACHE_CONNECTION: "cache"
  REDIS_CACHE_DB: "3"
  REDIS_QUEUE_CONNECTION: "default"
  REDIS_PREFIX: "anteraja-hackathon:"

  CACHE_STORE: "redis"
  CACHE_PREFIX: "anteraja-hackathon:"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  QUEUE_CONNECTION: "redis"

  FILESYSTEM_DISK: "local"
  MAIL_MAILER: "log"
  BROADCAST_CONNECTION: "log"
  BCRYPT_ROUNDS: "12"
