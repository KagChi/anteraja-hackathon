# Template saja — jangan commit nilai asli.
# Secret asli dibuat langsung di cluster; lihat README.
apiVersion: v1
kind: Secret
metadata:
  name: waha-secrets
  namespace: prod-other
  labels:
    app.kubernetes.io/name: waha
type: Opaque
stringData:
  # Dipakai sebagai header X-Api-Key untuk setiap request ke API WAHA.
  WAHA_API_KEY: "CHANGE_ME"
  WAHA_DASHBOARD_PASSWORD: "CHANGE_ME"
  WHATSAPP_SWAGGER_PASSWORD: "CHANGE_ME"
  # Header yang dikirim WAHA ke webhook inbound n8n. Nilai tokennya harus
  # sama dengan WAHA_HOOK_TOKEN pada Secret n8n-secrets.
  WHATSAPP_HOOK_CUSTOM_HEADERS: "X-Anteraja-Hook:CHANGE_ME"

