apiVersion: apps/v1
kind: Deployment
metadata:
  name: waha
  namespace: prod-other
  labels:
    app.kubernetes.io/name: waha
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Sesi WhatsApp terikat ke satu instance; jangan jalankan dua pod sekaligus.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: waha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waha
    spec:
      containers:
        - name: waha
          image: devlikeapro/waha:latest-2026.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: waha-config
            - secretRef:
                name: waha-secrets
          volumeMounts:
            # Sesi WhatsApp (supaya tidak perlu scan QR ulang setiap restart).
            - name: data
              mountPath: /app/.sessions
              subPath: sessions
            # File media yang dikirim dan diterima.
            - name: data
              mountPath: /app/.media
              subPath: media
            # Chromium butuh /dev/shm lebih besar dari 64Mi default.
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: waha-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

