apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waha
  namespace: prod-other
  labels:
    app.kubernetes.io/name: waha
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Tidak ada whitelist IP Cloudflare di sini: ServiceLB k3s memakai
    # externalTrafficPolicy=Cluster, jadi ingress-nginx melihat client sebagai
    # 10.42.0.1 (node) dan whitelist akan memblokir semua trafik, termasuk
    # trafik dari Cloudflare. Baca README untuk opsi mengunci origin.
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: waha.kagchi.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waha
                port:
                  name: http
  tls:
    - hosts:
        - waha.kagchi.my.id
      secretName: waha-tls

