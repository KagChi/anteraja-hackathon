apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: prod-other
  labels:
    app.kubernetes.io/name: n8n
data:
  # URL publik: n8n berada di belakang Cloudflare -> ingress-nginx.
  N8N_HOST: "n8n.kagchi.my.id"
  N8N_PROTOCOL: "https"
  N8N_PORT: "5678"
  N8N_EDITOR_BASE_URL: "https://n8n.kagchi.my.id/"
  WEBHOOK_URL: "https://n8n.kagchi.my.id/"
  N8N_PROXY_HOPS: "1"
  N8N_SECURE_COOKIE: "true"

  GENERIC_TIMEZONE: "Asia/Jakarta"
  TZ: "Asia/Jakarta"

  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"

  # Batasi riwayat eksekusi agar database tidak tumbuh tanpa batas.
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"

  # Database pada cluster CloudNativePG bersama.
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres-rw"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "postgres"
  DB_POSTGRESDB_SCHEMA: "public"

