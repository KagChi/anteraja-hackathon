# Template saja — jangan commit nilai asli.
# Secret asli dibuat langsung di cluster; lihat README.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: prod-other
  labels:
    app.kubernetes.io/name: n8n
type: Opaque
stringData:
  # Kunci enkripsi kredensial n8n. Simpan dan jangan pernah diubah setelah dipakai.
  N8N_ENCRYPTION_KEY: "CHANGE_ME"
  DB_POSTGRESDB_PASSWORD: "CHANGE_ME"
  # Dipakai deploy/n8n/deploy.sh untuk membuat credential workflow (lihat
  # deploy/n8n/README.md).
  WAHA_API_KEY: "CHANGE_ME"
  ANTERAJA_WEBHOOK_TOKEN: "CHANGE_ME"
  WAHA_HOOK_TOKEN: "CHANGE_ME"
  OPENAI_COMPAT_API_KEY: "CHANGE_ME"

